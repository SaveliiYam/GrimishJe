<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Отзывы наших клиентов о работе с Громыш. Узнайте, что думают студенты и школьники о наших услугах.">
  <meta name="keywords" content="отзывы, клиенты, студенческие работы, рефераты, курсовые, дипломы">
  <meta name="author" content="Громыш">
  <title>Отзывы — Громыш</title>
  <link rel="stylesheet" href="/static/styles.css?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #00bfff;
      --text-color: #333;
      --card-bg: rgba(255, 255, 255, 0.95);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
      --success-color: #f39c12;
      --rating-high: #2ecc71;
      --rating-mid: #f39c12;
      --rating-low: #e74c3c;
      --accent-color: #00bfff;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: url('/static/images/hero-image.jpg') no-repeat center center/cover;
    }

    main {
      flex: 1 0 auto;
    }

    .header-section {
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      margin-top: 5em;
      background: transparent !important; /* Убираем голубой фон */
      border-radius: 0 !important; /* Убираем скругление */
      box-shadow: none !important; /* Убираем тень */
    }

    .header-section-content {
      max-width: 800px;
      color: #fff;
      position: relative;
      z-index: 1;
      padding: 2em;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      background: transparent !important;
      backdrop-filter: none !important;
    }

    .header-section h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5em, 8vw, 3.5em);
      margin-bottom: 0.5em;
      animation: fadeIn 2s ease forwards;
      animation-delay: 0.5s;
    }

    .header-section p {
      font-size: clamp(1.2em, 4vw, 1.6em);
      max-width: 800px;
      line-height: 1.6;
      animation: fadeIn 2s ease forwards;
      animation-delay: 0.7s;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reviews-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2em;
      padding: 1em 0;
      margin: 2em auto;
      max-width: 1200px;
    }

    .review-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5em;
      box-shadow: var(--shadow-md);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      border-left: 4px solid var(--accent-color);
      animation: fadeInUp 1s ease-out;
    }

    .review-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .review-card.rating-high { border-left-color: var(--rating-high); }
    .review-card.rating-mid { border-left-color: var(--rating-mid); }
    .review-card.rating-low { border-left-color: var(--rating-low); }

    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1em;
    }

    .review-type {
      font-size: 0.9em;
      color: #888;
      background: rgba(0, 191, 255, 0.1);
      padding: 0.3em 0.6em;
      border-radius: 5px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .review-content {
      margin-bottom: 1em;
    }

    .review-text {
      font-style: italic;
      color: #555;
      min-height: 3em;
      font-size: 1.1em;
      margin-bottom: 0.5em;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.3s ease;
    }

    .review-text.expanded {
      -webkit-line-clamp: unset;
      overflow: visible;
    }

    .toggle-text {
      color: var(--primary-color);
      cursor: pointer;
      font-size: 0.9em;
      text-decoration: underline;
      margin-top: 0.5em;
      display: inline-block;
    }

    .toggle-text:hover {
      color: #0088cc;
    }

    .review-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9em;
      color: #888;
    }

    .review-author {
      font-weight: 500;
    }

    .review-date {
      font-style: italic;
    }

    .rating-stars {
      color: var(--success-color);
      margin-right: 0.5em;
      font-size: 1.2em;
    }

    .no-reviews {
      color: #fff;
      font-size: 1.2em;
      padding: 1em;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
    }

    .error-message {
      color: #e74c3c;
      font-size: 1.2em;
      padding: 1em;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .header-section {
        height: 50vh;
        padding: 2em 1em;
      }
      .header-section h1 {
        font-size: clamp(1.5em, 6vw, 2.5em);
      }
      .header-section p {
        font-size: clamp(0.9em, 3vw, 1.2em);
      }
      .reviews-container {
        grid-template-columns: 1fr;
      }
      .review-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .review-type {
        margin-bottom: 0.5em;
      }
      .review-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5em;
      }
    }
  </style>
</head>
<body>
  {{ template "nav.html" . }}

  <main>
    <header class="header-section reveal">
      <div class="header-section-content">
        <h1>Отзывы наших клиентов</h1>
        <p>Узнайте, что говорят наши клиенты о работе с нами. Мы ценим каждый отзыв и стремимся улучшать наши услуги каждый день.</p>
      </div>
    </header>

    <section class="reviews-container">
      <div id="reviews-container" class="reviews-container"></div>
    </section>
  </main>

  {{ template "footer.html" . }}

  <script>
    function revealOnScroll() {
      const reveals = document.querySelectorAll('.reveal');
      reveals.forEach((reveal) => {
        const windowHeight = window.innerHeight;
        const revealTop = reveal.getBoundingClientRect().top;
        const revealPoint = 150;
        if (revealTop < windowHeight - revealPoint) {
          reveal.classList.add('active');
        }
      });
    }

    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('load', revealOnScroll);

    function renderStars(rating) {
      const filledStar = '★';
      const emptyStar = '☆';
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        stars += i <= rating ? filledStar : emptyStar;
      }
      return stars;
    }

    async function fetchReviews() {
      try {
        const response = await fetch('/api/reviews');
        if (!response.ok) throw new Error('Ошибка загрузки отзывов');
        const reviews = await response.json();
        const container = document.getElementById('reviews-container');
        container.innerHTML = '';
        if (reviews.length === 0) {
          container.innerHTML = '<div class="no-reviews">Пока нет отзывов.</div>';
          return;
        }
        reviews.forEach(review => {
          if (!review.comment || !review.author || review.rating === undefined) {
            console.error('Некорректные данные отзыва:', review);
            return;
          }
          const ratingClass = review.rating >= 4
            ? 'rating-high'
            : review.rating === 3
              ? 'rating-mid'
              : 'rating-low';

          const workType = review.work_type && review.work_type.trim() !== ''
            ? review.work_type
            : 'Не указан';
          
          const maxLength = 100;
          const isLongReview = review.comment.length > maxLength;
          const shortComment = isLongReview
            ? review.comment.substring(0, maxLength) + '...'
            : review.comment;

          const card = document.createElement('div');
          card.className = `review-card ${ratingClass}`;
          card.innerHTML = `
            <div class="review-header">
              <div>
                <span class="review-type">${workType}</span>
              </div>
              <div class="rating-stars">${renderStars(review.rating)}</div>
            </div>
            <div class="review-content">
              <div class="review-text ${isLongReview ? '' : 'expanded'}" data-full="${review.comment}">${shortComment}</div>
              ${isLongReview ? '<span class="toggle-text">Показать больше</span>' : ''}
              <div class="review-info">
                <span class="review-author">${review.author}</span>
                <span class="review-date">${review.created_at ? ` ${review.created_at}` : ''}</span>
              </div>
            </div>
          `;
          container.appendChild(card);

          const toggleButton = card.querySelector('.toggle-text');
          if (toggleButton) {
            toggleButton.addEventListener('click', () => {
              const reviewText = card.querySelector('.review-text');
              if (reviewText.classList.contains('expanded')) {
                reviewText.classList.remove('expanded');
                reviewText.textContent = shortComment;
                toggleButton.textContent = 'Показать больше';
              } else {
                reviewText.classList.add('expanded');
                reviewText.textContent = reviewText.getAttribute('data-full');
                toggleButton.textContent = 'Скрыть';
              }
            });
          }
        });
      } catch (error) {
        console.error('Ошибка:', error);
        const container = document.getElementById('reviews-container');
        container.innerHTML = '<div class="error-message">Ошибка загрузки отзывов. Попробуйте позже.</div>';
      }
    }

    window.addEventListener('load', fetchReviews);
  </script>
</body>
</html>
