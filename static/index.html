<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Громыш | Помощь студентам</title>
  <!-- Подключаем CSS -->
  <link rel="stylesheet" href="/static/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <!-- Подключаем Font Awesome для иконок (если понадобятся) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6+2sZO8K+QGZC3zzX2Skd5y3H5H1GwY5gY6ip7Ee4ePFyW4+9lJH1N3rKT4zBZNp3XGzA4EPYY1p/9u6H+IQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* Основные стили страницы */
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    nav {
      padding: 1em;
      background: #007acc;
    }
    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    nav ul li {
      margin: 0 1em;
    }
    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    nav ul li a:hover {
      color: #ff6347;
    }
    .hero {
      position: relative;
      height: 100vh;
      background: url('/images/hero-background.jpg') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }
    .hero-content {
      max-width: 600px;
      animation: fadeIn 2s ease-in-out;
    }
    .hero-content h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
    }
    .hero-content p {
      font-size: 1.5em;
      margin-bottom: 1em;
    }
    .order-button {
      display: inline-block;
      padding: 1em 2em;
      font-size: 1.2em;
      color: #ffffff;
      background-color: transparent;
      text-decoration: none;
      border: 2px solid #00bfff;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      font-weight: bold;
      transition: color 0.3s ease, background-color 0.3s ease, transform 0.3s ease;
    }
    .order-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      background-color: #00bfff;
      z-index: -1;
      transition: width 0.4s ease;
    }
    .order-button:hover::before {
      width: 100%;
    }
    .order-button:hover {
      color: #fff;
      background-color: transparent;
      transform: scale(1.05);
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
      min-height: 200px;
      max-height: 90vh;
      transition: all 0.3s ease;
      overflow: hidden;
      position: relative;
    }
    .modal-content h2 {
      margin-bottom: 20px;
    }
    .modal-buttons {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }
    .switch-button {
      padding: 10px 20px;
      font-size: 1em;
      color: #ffffff;
      background-color: #00bfff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .switch-button:hover {
      background-color: #007acc;
    }
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 20px;
    }
    .auth-form input {
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .auth-form button {
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      background-color: #00bfff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .auth-form button:hover {
      background-color: #007acc;
      transform: scale(1.05);
    }
    .auth-form button:active {
      background-color: #005f99;
      transform: scale(1);
    }
    .close-button {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 20px;
      cursor: pointer;
      color: #333;
    }
    .telegram-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .telegram-wrapper img {
      width: auto;
      max-height: 30px;
    }
    .telegram-wrapper input {
      flex-grow: 1;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    /* Стиль для ошибок в форме */
    .error-message {
      color: #ffffff;
      background-color: #d8000c;
      padding: 8px 12px;
      border-radius: 5px;
      margin: 5px 0;
      font-size: 0.95em;
      text-align: center;
    }
    /* Toast уведомления */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(216,0,12,0.9);
      color: #fff;
      padding: 10px 20px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 3000;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="/" class="circle-link">Главная</a></li>
      <li><a href="/about" class="circle-link">О нас</a></li>
      <li><a href="/services" class="circle-link">Виды работ</a></li>
      <li><a href="/reviews" class="circle-link">Отзывы</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Добро пожаловать на Громыш!</h1>
      <p>Мы помогаем студентам и школьникам достичь успеха в учёбе.</p>
      <a href="#" class="order-button" id="openModal">Сделать заказ</a>
    </div>
  </section>

  <div class="modal" id="authModal">
    <div class="modal-content" id="modalContent">
      <span class="close-button" id="closeModal">&times;</span>
      <h2 id="modal-title">Выберите действие</h2>
      <div class="modal-buttons">
        <button class="switch-button" id="showLogin">Авторизация</button>
        <button class="switch-button" id="showRegister">Регистрация</button>
      </div>
      <!-- Форма авторизации -->
      <form id="loginForm" class="auth-form" action="/login" method="POST">
        <div id="loginGeneralError" class="error-message" style="display: none;"></div>
        <label for="loginEmail">Email:</label>
        <input type="email" id="loginEmail" name="email" required>
        <label for="loginPassword">Пароль:</label>
        <input type="password" id="loginPassword" name="password" required>
        <button type="submit">Войти</button>
      </form>
      <!-- Форма регистрации -->
      <form id="registerForm" class="auth-form" action="/register" method="POST">
        <div id="registerGeneralError" class="error-message" style="display: none;"></div>
        <label for="registerName">Имя:</label>
        <input type="text" id="registerName" name="name" required>
        <label for="registerEmail">Email:</label>
        <input type="email" id="registerEmail" name="email" required>
        <label for="registerPassword">Пароль:</label>
        <input type="password" id="registerPassword" name="password" required>
        <label for="registerPhone">Телефон:</label>
        <input type="tel" id="registerPhone" name="phone" placeholder="+7 (___) ___-__-__" required>
        <label for="registerTelegram">Telegram:</label>
        <div class="telegram-wrapper">
          <img src="/images/TG.png" alt="Telegram Icon">
          <input type="text" id="registerTelegram" name="telegram" placeholder="@username" required>
        </div>
        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; Громыш | Поддержка студентов и школьников</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const modal = document.getElementById('authModal');
    const modalContent = document.getElementById('modalContent');
    const openModal = document.getElementById('openModal');
    const closeModal = document.getElementById('closeModal');
    const showLogin = document.getElementById('showLogin');
    const showRegister = document.getElementById('showRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const modalTitle = document.getElementById('modal-title');
    const phoneInput = document.getElementById('registerPhone');
    const loginGeneralError = document.getElementById('loginGeneralError');
    const registerGeneralError = document.getElementById('registerGeneralError');

    // Форматирование номера телефона в формате +7 (XXX) XXX-XX-XX
    function formatPhone(value) {
      const digits = value.replace(/\D/g, '');
      const part1 = digits.substring(0, 1);
      const part2 = digits.substring(1, 4);
      const part3 = digits.substring(4, 7);
      const part4 = digits.substring(7, 9);
      const part5 = digits.substring(9, 11);
      let formatted = '';
      if (part1) {
        formatted = '+' + part1;
      }
      if (part2) {
        formatted += ' (' + part2;
        if (part2.length === 3) {
          formatted += ')';
        }
      }
      if (part3) {
        formatted += ' ' + part3;
      }
      if (part4) {
        formatted += '-' + part4;
      }
      if (part5) {
        formatted += '-' + part5;
      }
      return formatted;
    }

    phoneInput.addEventListener('input', function(e) {
      this.value = formatPhone(this.value);
    });

    function adjustModalHeight() {
      const activeForm = loginForm.style.display === 'flex' ? loginForm : registerForm;
      const formHeight = activeForm.offsetHeight + 120;
      modalContent.style.height = formHeight + 'px';
    }

    openModal.addEventListener('click', (e) => {
      e.preventDefault();
      modal.style.display = 'flex';
      modalTitle.textContent = 'Выберите действие';
      loginForm.style.display = 'none';
      registerForm.style.display = 'none';
      loginGeneralError.style.display = 'none';
      registerGeneralError.style.display = 'none';
      modalContent.style.height = '200px';
    });

    closeModal.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });

    showLogin.addEventListener('click', () => {
      loginForm.style.display = 'flex';
      registerForm.style.display = 'none';
      modalTitle.textContent = 'Авторизация';
      adjustModalHeight();
    });

    showRegister.addEventListener('click', () => {
      registerForm.style.display = 'flex';
      loginForm.style.display = 'none';
      modalTitle.textContent = 'Регистрация';
      adjustModalHeight();
    });

    // Перехват отправки формы авторизации через AJAX
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginGeneralError.style.display = 'none';
      const formData = new FormData(loginForm);
      try {
        const response = await fetch('/login', {
          method: 'POST',
          body: formData
        });
        if (!response.ok) {
          const data = await response.json();
          loginGeneralError.textContent = data.error || 'Ошибка авторизации';
          loginGeneralError.style.display = 'block';
          // Показываем toast только для непредвиденных ошибок (при необходимости)
          // showToast(loginGeneralError.textContent);
        } else {
          modal.style.display = 'none';
          window.location.href = '/dashboard';
        }
      } catch (err) {
        loginGeneralError.textContent = 'Ошибка соединения с сервером';
        loginGeneralError.style.display = 'block';
        // showToast(loginGeneralError.textContent);
      }
    });

    // Перехват отправки формы регистрации через AJAX (без дублирования toast)
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerGeneralError.style.display = 'none';
      const formData = new FormData(registerForm);
      try {
        const response = await fetch('/register', {
          method: 'POST',
          body: formData
        });
        if (!response.ok) {
          const data = await response.json();
          registerGeneralError.textContent = data.error || 'Ошибка регистрации';
          registerGeneralError.style.display = 'block';
          // Не вызываем showToast, чтобы ошибка отображалась только в форме
        } else {
          modal.style.display = 'none';
          window.location.href = '/dashboard';
        }
      } catch (err) {
        registerGeneralError.textContent = 'Ошибка соединения с сервером';
        registerGeneralError.style.display = 'block';
        // Не вызываем showToast, чтобы ошибка отображалась только в форме
      }
    });

    // Функция показа toast уведомления (используется только для логина и прочих ошибок)
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
