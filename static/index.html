<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Громыш | Помощь студентам</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6+2sZO8K+QGZC3zzX2Skd5y3H5H1GwY5gY6ip7Ee4ePFyW4+9lJH1N3rKT4zBZNp3XGzA4EPYY1p/9u6H+IQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
      line-height: 1.6;
    }

    nav {
      padding: 1em;
      background: #007acc;
    }
    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    nav ul li {
      margin: 0 1em;
    }
    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    nav ul li a:hover {
      color: #ff6347;
    }

    .hero {
      height: 100vh;
      background: url('/images/hero-background.jpg') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }
    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 122, 204, 0.3);
    }
    .hero-content {
      max-width: 700px;
      color: #fff;
      position: relative;
      z-index: 1;
      padding: 2em;
      animation: fadeIn 1.5s ease-in-out;
    }
    .hero-content h1 {
      font-size: 3.5em;
      margin-bottom: 0.5em;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
    }
    .hero-content p {
      font-size: 1.6em;
      margin-bottom: 1.5em;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
    }
    .order-button {
      padding: 1em 2.5em;
      font-size: 1.3em;
      color: #fff;
      background: linear-gradient(135deg, #00bfff 0%, #007acc 100%);
      text-decoration: none;
      border: none;
      border-radius: 25px;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: pulseGlow 2s infinite;
      position: relative;
    }
    .order-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      background: linear-gradient(135deg, #007acc 0%, #00bfff 100%);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal.show {
      opacity: 1;
    }
    .modal-content {
      background: #fff;
      padding: 2em;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
      animation: slideIn 0.3s ease;
      position: relative;
    }
    .modal-content h2 {
      color: #007acc;
      margin-bottom: 1.5em;
      text-align: center;
    }
    .modal-buttons {
      display: flex;
      gap: 1em;
      justify-content: center;
      margin-bottom: 1.5em;
      transition: opacity 0.3s ease;
    }
    .switch-button {
      padding: 0.8em 1.5em;
      font-size: 1em;
      color: #fff;
      background: #00bfff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .switch-button:hover {
      background: #007acc;
      transform: translateY(-2px);
    }
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 1em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .auth-form.show {
      opacity: 1;
    }
    .auth-form input {
      padding: 0.8em;
      font-size: 1em;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #fafafa;
    }
    .auth-form button {
      padding: 0.8em;
      font-size: 1em;
      background: #00bfff;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .auth-form button:hover {
      background: #007acc;
      transform: translateY(-2px);
    }
    .close-button {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #666;
      transition: color 0.3s ease;
    }
    .close-button:hover {
      color: #007acc;
    }
    .telegram-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5em;
    }
    .telegram-wrapper img {
      max-height: 25px;
    }
    .error-message {
      color: #fff;
      background: #d32f2f;
      padding: 0.5em 1em;
      border-radius: 10px;
      font-size: 0.9em;
    }

    footer {
      text-align: center;
      padding: 1em;
      background: #fafafa;
      color: #888;
      font-size: 0.9em;
    }

    /* Анимации */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes pulseGlow {
      0% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(0, 191, 255, 0.5);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 6px 25px rgba(0, 191, 255, 0.8);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(0, 191, 255, 0.5);
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="/">Главная</a></li>
      <li><a href="/about">О нас</a></li>
      <li><a href="/services">Виды работ</a></li>
      <li><a href="/reviews">Отзывы</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Добро пожаловать в Громыш!</h1>
      <p>Ваша поддержка в учёбе — наша забота. Успех гарантирован!</p>
      <a href="#" class="order-button" id="openModal">Сделать заказ</a>
    </div>
  </section>

  <div class="modal" id="authModal">
    <div class="modal-content">
      <span class="close-button" id="closeModal">×</span>
      <h2 id="modal-title">Выберите действие</h2>
      <div class="modal-buttons" id="modalButtons">
        <button class="switch-button" id="showLogin">Войти</button>
        <button class="switch-button" id="showRegister">Регистрация</button>
      </div>
      <form id="loginForm" class="auth-form" action="/login" method="POST">
        <div id="loginGeneralError" class="error-message" style="display: none;"></div>
        <input type="email" id="loginEmail" name="email" placeholder="Email" required>
        <input type="password" id="loginPassword" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
      </form>
      <form id="registerForm" class="auth-form" action="/register" method="POST">
        <div id="registerGeneralError" class="error-message" style="display: none;"></div>
        <input type="text" id="registerName" name="name" placeholder="Имя" required>
        <input type="email" id="registerEmail" name="email" placeholder="Email" required>
        <input type="password" id="registerPassword" name="password" placeholder="Пароль" required>
        <input type="tel" id="registerPhone" name="phone" placeholder="+7 (___) ___-__-__" required>
        <div class="telegram-wrapper">
          <img src="/images/TG.png" alt="Telegram">
          <input type="text" id="registerTelegram" name="telegram" placeholder="@username" required>
        </div>
        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2025 Громыш | Помощь студентам и школьникам</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    document.documentElement.style.scrollBehavior = 'smooth';

    const modal = document.getElementById('authModal');
    const modalButtons = document.getElementById('modalButtons');
    const openModal = document.getElementById('openModal');
    const closeModal = document.getElementById('closeModal');
    const showLogin = document.getElementById('showLogin');
    const showRegister = document.getElementById('showRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const modalTitle = document.getElementById('modal-title');
    const phoneInput = document.getElementById('registerPhone');
    const loginGeneralError = document.getElementById('loginGeneralError');
    const registerGeneralError = document.getElementById('registerGeneralError');

    // Форматирование номера телефона
    function formatPhone(value) {
      const digits = value.replace(/\D/g, '');
      const part1 = digits.substring(0, 1);
      const part2 = digits.substring(1, 4);
      const part3 = digits.substring(4, 7);
      const part4 = digits.substring(7, 9);
      const part5 = digits.substring(9, 11);
      let formatted = '';
      if (part1) formatted = '+' + part1;
      if (part2) {
        formatted += ' (' + part2;
        if (part2.length === 3) formatted += ')';
      }
      if (part3) formatted += ' ' + part3;
      if (part4) formatted += '-' + part4;
      if (part5) formatted += '-' + part5;
      return formatted;
    }

    phoneInput.addEventListener('input', function(e) {
      this.value = formatPhone(this.value);
    });

    // Сброс состояния модального окна при открытии
    function resetModal() {
      modalButtons.style.display = 'flex';
      modalButtons.style.opacity = '1';
      loginForm.style.display = 'none';
      loginForm.classList.remove('show');
      registerForm.style.display = 'none';
      registerForm.classList.remove('show');
      modalTitle.textContent = 'Выберите действие';
      loginGeneralError.style.display = 'none';
      registerGeneralError.style.display = 'none';
    }

    openModal.addEventListener('click', (e) => {
      e.preventDefault();
      resetModal(); // Сбрасываем состояние
      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('show'), 10);
    });

    closeModal.addEventListener('click', () => {
      modal.classList.remove('show');
      setTimeout(() => modal.style.display = 'none', 300);
    });

    window.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('show');
        setTimeout(() => modal.style.display = 'none', 300);
      }
    });

    showLogin.addEventListener('click', () => {
      modalButtons.style.opacity = '0';
      setTimeout(() => {
        modalButtons.style.display = 'none';
        loginForm.style.display = 'flex';
        setTimeout(() => loginForm.classList.add('show'), 10);
        modalTitle.textContent = 'Авторизация';
      }, 300);
    });

    showRegister.addEventListener('click', () => {
      modalButtons.style.opacity = '0';
      setTimeout(() => {
        modalButtons.style.display = 'none';
        registerForm.style.display = 'flex';
        setTimeout(() => registerForm.classList.add('show'), 10);
        modalTitle.textContent = 'Регистрация';
      }, 300);
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginGeneralError.style.display = 'none';
      const formData = new FormData(loginForm);
      try {
        const response = await fetch('/login', {
          method: 'POST',
          body: formData
        });
        if (!response.ok) {
          const data = await response.json();
          loginGeneralError.textContent = data.error || 'Ошибка авторизации';
          loginGeneralError.style.display = 'block';
        } else {
          modal.classList.remove('show');
          setTimeout(() => {
            modal.style.display = 'none';
            window.location.href = '/dashboard';
          }, 300);
        }
      } catch (err) {
        loginGeneralError.textContent = 'Ошибка соединения с сервером';
        loginGeneralError.style.display = 'block';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerGeneralError.style.display = 'none';
      const formData = new FormData(registerForm);
      try {
        const response = await fetch('/register', {
          method: 'POST',
          body: formData
        });
        if (!response.ok) {
          const data = await response.json();
          registerGeneralError.textContent = data.error || 'Ошибка регистрации';
          registerGeneralError.style.display = 'block';
        } else {
          modal.classList.remove('show');
          setTimeout(() => {
            modal.style.display = 'none';
            window.location.href = '/dashboard';
          }, 300);
        }
      } catch (err) {
        registerGeneralError.textContent = 'Ошибка соединения с сервером';
        registerGeneralError.style.display = 'block';
      }
    });

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
