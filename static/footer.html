<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Громыш - Подвал</title>
  <style>
    .footer {
      background: linear-gradient(135deg, #2d3748, #1a202c);
      color: #e2e8f0;
      padding: 2em 1em;
      text-align: center;
      font-size: clamp(0.85em, 1.8vw, 0.95em);
      position: relative;
      overflow: hidden;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5em;
      padding-bottom: 1.5em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .footer-logo h3 {
      font-size: clamp(1.4em, 3.5vw, 1.8em);
      margin-bottom: 0.3em;
      color: #00bfff;
    }

    .footer-logo p {
      font-size: clamp(0.85em, 1.8vw, 0.95em);
      opacity: 0.8;
    }

    .footer-links, .footer-contact {
      flex: 1;
      min-width: 180px;
    }

    .footer-links h4, .footer-contact h4 {
      font-size: clamp(1.1em, 2.5vw, 1.3em);
      margin-bottom: 0.8em;
      color: #fff;
    }

    .footer-links ul {
      list-style: none;
      padding: 0;
    }

    .footer-links ul li {
      margin-bottom: 0.4em;
    }

    .footer-links a, .footer-contact a {
      color: #e2e8f0;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-links a:hover, .footer-contact a:hover {
      color: #00bfff;
    }

    .footer-contact p {
      display: flex;
      align-items: center;
      gap: 0.5em;
      justify-content: center;
    }

    .icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      background-size: contain;
      background-repeat: no-repeat;
    }

    .email-icon {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="%23e2e8f0" viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>');
    }

    .telegram-icon {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="%23e2e8f0" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.587 17.073c-.387 1.15-2.066 1.828-3.418 1.828-1.35 0-2.72-.677-3.418-1.828l-4.29-5.14a.5.5 0 01.068-.694l1.81-1.51a.5.5 0 01.694.068l3.418 4.09c.193.23.503.23.696 0l3.418-4.09a.5.5 0 01.694-.068l1.81 1.51a.5.5 0 01.068.694l-4.29 5.14z"/></svg>');
    }

    .footer-bottom {
      padding-top: 1em;
      font-size: clamp(0.75em, 1.8vw, 0.85em);
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .footer-content {
        flex-direction: column;
        text-align: center;
        gap: 1em;
      }

      .footer-logo, .footer-links, .footer-contact {
        margin-bottom: 1em;
      }

      .footer-contact p {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-logo">
        <h3>Громыш</h3>
        <p>Поддержка студентов и школьников</p>
      </div>
      <div class="footer-links">
        <h4>Навигация</h4>
        <ul>
          <li><a href="/">Главная</a></li>
          <li><a href="/about">О нас</a></li>
          <li><a href="/services">Виды работ</a></li>
          <li><a href="/reviews">Отзывы</a></li>
        </ul>
      </div>
      <div class="footer-contact">
        <h4>Свяжитесь с нами</h4>
        <p><span class="icon email-icon"></span>Email: <a href="mailto:support@gromysh.ru">support@gromysh.ru</a></p>
        <p><span class="icon telegram-icon"></span>Telegram: <a href="https://t.me/gromysh" target="_blank">@gromysh</a></p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2025 Громыш. Все права защищены.</p>
    </div>
  </footer>
</body>
</html>
