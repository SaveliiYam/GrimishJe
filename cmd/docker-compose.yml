version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - minio
    environment:
      # Если ваш код использует переменную MINIO_ENDPOINT, укажите здесь нужное значение.
      - MINIO_ENDPOINT=minio:9000
    networks:
      - appnet

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioaccesskey
      MINIO_ROOT_PASSWORD: miniosecretkey
    volumes:
      - minio_data:/data
    networks:
      - appnet

networks:
  appnet:

volumes:
  minio_data:
